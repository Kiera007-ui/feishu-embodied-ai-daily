<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/><title>具身智能每日推 · 飞书转发</title><style>body{font-family:Arial,"PingFang SC",sans-serif;max-width:760px;margin:48px auto;padding:0 20px;line-height:1.6}textarea{width:100%;min-height:360px;padding:14px;font-size:15px;box-sizing:border-box}button{margin-top:14px;padding:10px 18px;font-size:15px;cursor:pointer}.note{color:#666;font-size:13px;margin:8px 0 18px}.ok{color:#087f23}.err{color:#b42318}</style></head><body><h1>具身智能每日推 · 飞书转发</h1><p class="note">这里只负责把已经生成好的每日内容转发到飞书群机器人，不调用 OpenAI API。打开页面本身不会发送消息。</p><textarea id="msg" placeholder="粘贴每日推送内容。首行请使用：具身智能每日推｜YYYY.MM.DD"></textarea><br/><button id="send">发送到飞书</button><p id="status"></p><script>const btn=document.getElementById('send');const msg=document.getElementById('msg');const status=document.getElementById('status');async function hashText(text){const data=new TextEncoder().encode(text);const digest=await crypto.subtle.digest('SHA-256',data);return Array.from(new Uint8Array(digest)).map(b=>b.toString(16).padStart(2,'0')).join('');}btn.onclick=async()=>{const text=msg.value.trim();if(!text){status.className='err';status.textContent='请先填写消息内容';return;}if(!text.startsWith('具身智能每日推｜')){status.className='err';status.textContent='首行必须以“具身智能每日推｜”开头';return;}const key='sent:'+await hashText(text);if(sessionStorage.getItem(key)==='1'){btn.disabled=true;status.className='ok';status.textContent='本次会话中这条内容已经发送过，已阻止重复发送';return;}btn.disabled=true;status.className='';status.textContent='正在发送…';try{const r=await fetch('/api/send',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({text})});const j=await r.json();if(!r.ok||!j.ok)throw new Error(j.error||'发送失败');sessionStorage.setItem(key,'1');status.className='ok';status.textContent=j.deduped?'检测到重复内容，未再次发送':'已发送到飞书群';}catch(e){btn.disabled=false;status.className='err';status.textContent='发送失败：'+e.message;}};</script></body></html>
