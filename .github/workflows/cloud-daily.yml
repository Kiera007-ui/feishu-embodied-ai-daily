name: Cloud embodied AI daily

on:
  # Daily trigger from Vercel Cron (api/cron.js), 09:00-09:59 Beijing.
  repository_dispatch:
    types: [embodied-daily]
  # Fallback if the Vercel trigger did not run. GitHub schedules can be hours late.
  schedule:
    - cron: "37 10 * * *"
      timezone: "Asia/Shanghai"
  workflow_dispatch:
    inputs:
      mode:
        description: "dry = generate and check only; live = send to Feishu"
        type: choice
        options: [dry, live]
        default: dry
  # Committing ops/dry-run.txt starts a dry run without sending.
  push:
    branches: [main]
    paths: ["ops/dry-run.txt"]

permissions:
  contents: write
  id-token: write

concurrency:
  group: embodied-ai-daily-feishu
  cancel-in-progress: false

jobs:
  cloud-daily:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - name: Decide date, mode and whether to run
        id: gate
        shell: bash
        env:
          INPUT_MODE: ${{ inputs.mode }}
        run: |
          set -euo pipefail
          DATE="$(TZ=Asia/Shanghai date +%Y.%m.%d)"
          MODE=live
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then MODE=dry; fi
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then MODE="${INPUT_MODE:-dry}"; fi
          SKIP=false
          if [ "$MODE" = "live" ]; then
            if [ "$GITHUB_EVENT_NAME" != "workflow_dispatch" ] &&
               [ "$(jq -r '.cloud_daily_enabled // false' config/pipeline.json)" != "true" ]; then
              SKIP=true
              echo "Cloud daily is not enabled in config/pipeline.json."
            fi
            if { [ -f state/last-success.json ] && [ "$(jq -r '.date // ""' state/last-success.json)" = "$DATE" ]; } ||
               { [ -f state/last-attempt.json ] && [ "$(jq -r '.date // ""' state/last-attempt.json)" = "$DATE" ]; }; then
              SKIP=true
              echo "A send or send attempt already exists for $DATE."
            fi
          fi
          echo "date=$DATE" >> "$GITHUB_OUTPUT"
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"
          echo "skip=$SKIP" >> "$GITHUB_OUTPUT"
          echo "date=$DATE mode=$MODE skip=$SKIP"

      - name: Set up Node.js
        if: steps.gate.outputs.skip != 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Require OpenAI API key
        if: steps.gate.outputs.skip != 'true'
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          if [ -z "$OPENAI_API_KEY" ]; then
            echo '::error::Add the OPENAI_API_KEY repository secret.'
            exit 1
          fi

      - name: Collect candidates from media sources
        if: steps.gate.outputs.skip != 'true'
        env:
          DATE: ${{ steps.gate.outputs.date }}
        run: |
          mkdir -p /tmp/daily
          node scripts/collect.mjs "$DATE" /tmp/daily/collected.json
          jq -r '.coverage[] | "\(.source): \(.status) \(.found) listed, \(.relevant) relevant"' /tmp/daily/collected.json

      - name: Select and write items with the model
        if: steps.gate.outputs.skip != 'true'
        env:
          DATE: ${{ steps.gate.outputs.date }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL }}
          OPENAI_REASONING: ${{ vars.OPENAI_REASONING }}
        run: node scripts/generate.mjs "$DATE" /tmp/daily/collected.json /tmp/daily/model.json

      - name: Check every item against the rules
        if: steps.gate.outputs.skip != 'true'
        env:
          DATE: ${{ steps.gate.outputs.date }}
        run: |
          node scripts/cloud-daily.mjs build "$DATE" /tmp/daily/collected.json /tmp/daily/model.json /tmp/daily
          {
            cat /tmp/daily/report.md
            echo
            echo '## 推送文本'
            echo
            echo '```text'
            cat /tmp/daily/payload.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Keep run files
        if: always() && steps.gate.outputs.skip != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: daily-${{ steps.gate.outputs.date }}-${{ github.run_id }}
          path: /tmp/daily
          if-no-files-found: ignore

      - name: Claim today's delivery before sending
        id: claim
        if: steps.gate.outputs.skip != 'true' && steps.gate.outputs.mode == 'live'
        shell: bash
        env:
          DATE: ${{ steps.gate.outputs.date }}
        run: |
          set -euo pipefail
          git fetch origin main
          git reset --hard origin/main
          if { [ -f state/last-success.json ] && [ "$(jq -r '.date // ""' state/last-success.json)" = "$DATE" ]; } ||
             { [ -f state/last-attempt.json ] && [ "$(jq -r '.date // ""' state/last-attempt.json)" = "$DATE" ]; }; then
            echo "claimed=false" >> "$GITHUB_OUTPUT"
            echo "Another run claimed or sent $DATE."
            exit 0
          fi
          mkdir -p state
          jq -n --arg date "$DATE" --arg run_id "$GITHUB_RUN_ID" \
            --arg payload_sha256 "$(sha256sum /tmp/daily/payload.txt | awk '{print $1}')" \
            '{date:$date,run_id:$run_id,payload_sha256:$payload_sha256,status:"attempted"}' > state/last-attempt.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/last-attempt.json
          git commit -m "Claim cloud daily delivery for $DATE"
          git push origin HEAD:main
          echo "claimed=true" >> "$GITHUB_OUTPUT"

      - name: Request GitHub OIDC token
        id: oidc
        if: steps.gate.outputs.skip != 'true' && (steps.gate.outputs.mode == 'dry' || steps.claim.outputs.claimed == 'true')
        uses: actions/github-script@v8
        with:
          script: |
            const token = await core.getIDToken('feishu-embodied-ai-daily-relay');
            core.setSecret(token);
            core.setOutput('token', token);

      - name: Send through the relay (dry runs only validate)
        if: steps.gate.outputs.skip != 'true' && (steps.gate.outputs.mode == 'dry' || steps.claim.outputs.claimed == 'true')
        shell: bash
        env:
          OIDC_TOKEN: ${{ steps.oidc.outputs.token }}
          DATE: ${{ steps.gate.outputs.date }}
          MODE: ${{ steps.gate.outputs.mode }}
        run: |
          set -euo pipefail
          URL="https://feishu-embodied-ai-daily.vercel.app/api/relay"
          if [ "$MODE" = "dry" ]; then URL="$URL?dry=1"; fi
          jq -n --arg text "$(cat /tmp/daily/payload.txt)" --arg date "$DATE" '{text:$text,date:$date}' > /tmp/daily/request.json
          HTTP_CODE="$(curl --silent --show-error --location --connect-timeout 15 --max-time 45 \
            --request POST --header "Authorization: Bearer $OIDC_TOKEN" --header "Content-Type: application/json" \
            --data-binary @/tmp/daily/request.json --output /tmp/daily/response.json --write-out "%{http_code}" "$URL")"
          echo "HTTP $HTTP_CODE"
          jq '{ok,dry_run,sent,date,item_count,error}' /tmp/daily/response.json || head -c 1000 /tmp/daily/response.json
          test "$HTTP_CODE" -ge 200 && test "$HTTP_CODE" -lt 300
          test "$(jq -r '.ok // false' /tmp/daily/response.json)" = "true"
          if [ "$MODE" = "dry" ]; then
            test "$(jq -r '.dry_run // false' /tmp/daily/response.json)" = "true"
          else
            test "$(jq -r '.sent // false' /tmp/daily/response.json)" = "true"
          fi

      - name: Record confirmed delivery and report
        if: steps.gate.outputs.mode == 'live' && steps.claim.outputs.claimed == 'true' && success()
        shell: bash
        env:
          DATE: ${{ steps.gate.outputs.date }}
        run: |
          set -euo pipefail
          mkdir -p queue reports state
          cp /tmp/daily/payload.txt "queue/$DATE.txt"
          cp /tmp/daily/report.md "reports/$DATE.md"
          jq -n --arg date "$DATE" \
            --arg sent_at "$(TZ=Asia/Shanghai date --iso-8601=seconds)" \
            --arg run_id "$GITHUB_RUN_ID" \
            --arg source_commit "$GITHUB_SHA" \
            --arg payload_sha256 "$(sha256sum /tmp/daily/payload.txt | awk '{print $1}')" \
            --argjson item_count "$(grep -Ec '^[0-9]+\. ' /tmp/daily/payload.txt || true)" \
            '{date:$date,sent_at:$sent_at,github_run_id:$run_id,source_commit:$source_commit,payload_sha256:$payload_sha256,item_count:$item_count,sent:true}' \
            > state/last-success.json
          git add "queue/$DATE.txt" "reports/$DATE.md" state/last-success.json
          git commit -m "Record cloud Feishu daily push for $DATE"
          git pull --rebase origin main
          git push origin HEAD:main
