name: Embodied AI Daily to Feishu

on:
  schedule:
    - cron: "7 1 * * *"
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/daily-feishu.yml"

permissions:
  contents: write
  id-token: write

concurrency:
  group: embodied-ai-daily-feishu
  cancel-in-progress: false

jobs:
  daily-push:
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Resolve run mode and durable dedupe state
        id: mode
        shell: bash
        run: |
          set -euo pipefail
          TODAY="$(TZ=Asia/Singapore date +%Y.%m.%d)"
          echo "today=$TODAY" >> "$GITHUB_OUTPUT"

          if [ "$GITHUB_EVENT_NAME" = "schedule" ]; then
            echo "dry_run=false" >> "$GITHUB_OUTPUT"
            if [ -f state/last-success.json ] && [ "$(jq -r '.date // ""' state/last-success.json)" = "$TODAY" ]; then
              echo "skip=true" >> "$GITHUB_OUTPUT"
              echo "Already sent for $TODAY; skipping."
            else
              echo "skip=false" >> "$GITHUB_OUTPUT"
            fi
          else
            # Push/workflow_dispatch are validation-only. They must never send Feishu.
            echo "dry_run=true" >> "$GITHUB_OUTPUT"
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Request GitHub OIDC token
        if: steps.mode.outputs.skip != 'true'
        id: oidc
        uses: actions/github-script@v7
        with:
          script: |
            const token = await core.getIDToken('feishu-embodied-ai-daily');
            core.setSecret(token);
            core.setOutput('token', token);

      - name: Call server-side daily pipeline
        if: steps.mode.outputs.skip != 'true'
        id: call
        env:
          OIDC_TOKEN: ${{ steps.oidc.outputs.token }}
          DRY_RUN: ${{ steps.mode.outputs.dry_run }}
        shell: bash
        run: |
          set -euo pipefail

          URL="https://feishu-embodied-ai-daily.vercel.app/api/push"
          if [ "$DRY_RUN" = "true" ]; then
            URL="$URL?dry=1"
          fi

          HTTP_CODE="$(curl --silent --show-error --location             --request POST             --header "Authorization: Bearer $OIDC_TOKEN"             --header "Content-Type: application/json"             --output response.json             --write-out "%{http_code}"             "$URL")"

          echo "HTTP $HTTP_CODE"
          cat response.json | jq '{ok, dry_run, sent, deduped, date, item_count, error}'

          if [ "$HTTP_CODE" -lt 200 ] || [ "$HTTP_CODE" -ge 300 ]; then
            exit 1
          fi

          if [ "$(jq -r '.ok // false' response.json)" != "true" ]; then
            exit 1
          fi

          if [ "$DRY_RUN" = "false" ]; then
            SENT="$(jq -r '.sent // false' response.json)"
            DEDUPED="$(jq -r '.deduped // false' response.json)"
            if [ "$SENT" != "true" ] && [ "$DEDUPED" != "true" ]; then
              echo "Live scheduled call returned no confirmed send/dedupe state."
              exit 1
            fi
          fi

      - name: Persist successful send state
        if: github.event_name == 'schedule' && steps.mode.outputs.skip != 'true' && success()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p state
          DATE="$(jq -r '.date' response.json)"
          ITEM_COUNT="$(jq -r '.item_count // 0' response.json)"
          SENT="$(jq -r '.sent // false' response.json)"
          DEDUPED="$(jq -r '.deduped // false' response.json)"
          NOW="$(TZ=Asia/Singapore date --iso-8601=seconds)"

          jq -n             --arg date "$DATE"             --arg sent_at "$NOW"             --arg run_id "$GITHUB_RUN_ID"             --arg commit "$GITHUB_SHA"             --argjson item_count "$ITEM_COUNT"             --argjson sent "$SENT"             --argjson deduped "$DEDUPED"             '{
              date: $date,
              sent_at: $sent_at,
              github_run_id: $run_id,
              source_commit: $commit,
              item_count: $item_count,
              sent: $sent,
              deduped: $deduped
            }' > state/last-success.json

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/last-success.json

          if git diff --cached --quiet; then
            echo "No state change to commit."
            exit 0
          fi

          git commit -m "Record Feishu daily push for $DATE"
          git push origin HEAD:main
